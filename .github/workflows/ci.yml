name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck, lint, and test
    # node-gyp 11 does not recognize Visual Studio 18 on windows-latest.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  docs:
    name: Skill mirror is in sync
    # A byte comparison of two directories, so it needs neither Windows nor a
    # dependency install. Kept separate from the gates job so a drifted mirror
    # reads as its own failure rather than hiding behind a typecheck error.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify .agents/skills mirrors .claude/skills
        run: node scripts/sync-skills.mjs --check
