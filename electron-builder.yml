appId: com.struq.voice
productName: Struq Voice
copyright: Copyright (c) 2026 Struq
directories:
  buildResources: resources
  # Overridden by scripts/lib/release-dir.mjs at build time. electron-builder
  # renames win-unpacked.tmp into place, and under Documents that rename can
  # fail with EPERM, so the release scripts build to a temp directory.
  output: release
files:
  - out/**
  - "!**/*.map"
  # Runtime assets loaded from disk by path rather than bundled: the tray
  # icons and the capture sounds. Without this they are absent from the asar
  # and both degrade silently in a packaged build (an empty nativeImage, a
  # failed Audio load) while working fine in dev.
  - resources/tray/**
  - resources/sounds/**

# Where installed copies look for updates, and what makes latest.yml get
# written at all. The signature in struq-voice-release.json is what actually
# authorises an update; this only says where to look.
publish:
  - provider: github
    owner: Deckdot
    repo: struq-voice
    releaseType: release

win:
  icon: resources/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  executableName: Struq Voice
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Assisted rather than one-click: choosing a directory and reading what the
  # app is are reasonable to ask once. Updates install silently (/S), so this
  # wizard is only the first install.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Struq Voice
  uninstallDisplayName: Struq Voice
  artifactName: ${name}-${version}-setup.${ext}
  runAfterFinish: true
  # Differential updates need the blockmap beside the installer.
  differentialPackage: true
